<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Animal</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Italiana&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Italianno&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

      body {
        padding: 0px;
        margin: 0px;
        display: flex;

        align-items: center;
        flex-direction: column;
        background-color: #f4f7fb;
      }

      header {
        background-color: white;
        width: 100%;
        padding: 40px 0px 40px 0px;

        align-items: center;
        text-align: center;

        display: flex;
        justify-content: center;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 80px;
      }

      nav > a:hover {
        text-decoration: underline;
      }

      nav > a > img {
        height: auto;
        height: 70px;
        width: 80px;
      }

      a {
        text-decoration: none;
        color: black;
        font-family: "Courier New", Courier, monospace;
      }

      div#container {
        background-color: red;
        display: flex;
        justify-content: center;

        max-width: 1440px;
        width: 100%;

        padding: 0px 90px 0px 90px;
        margin: 30px 0px 0px 0px;
      }

      div#fotoAnimal {
        background-color: white;
        width: 549px;
        height: 549px;
        margin-right: 107px;

        border-radius: 20px;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      #imagemGrande {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;

        border: 3px solid #36c3ff;
      }

      div#cardFotoAnimal {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        background-color: white;
        width: 550px;
        height: 116px;

        margin-top: 36px;
        gap: 18px;
      }

      img.miniatura {
        width: 116px;
        height: 116px;

        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
        opacity: 0.8;

        border-width: 3px;
        border-style: solid;
        border-color: #36c3ff;
      }

      img.miniatura:hover {
        opacity: 1;
      }

      img.miniatura.ativa {
        opacity: 1;
      }

        div#descricaoAnimal {
        background-color: white;
        width: 603px;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);
      }

        #descricaoAnimal > input {
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 16px;
        background: #f9fbfd;

        border: 1px solid #dce3ea;
        border-radius: 10px;
        box-sizing: border-box;
        
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 42px;
        color: #222;
      }


      #descricaoAnimal textarea {
        width: 100%;
        min-height: 120px;
        padding: 18px;
        background: #f9fbfd;

        border-radius: 10px;
        border: 1px solid #dce3ea;
        box-sizing: border-box;
       
        resize: vertical;
        font-size: 16px;
        font-family: "Inter", sans-serif;
      }

        input::placeholder,
        textarea::placeholder {
        font-size: 14px;
        font-weight: 500;
        font-family: "Inter", sans-serif;
      }

      div#colunaCard1 {
        align-items: start;
        justify-content: flex-start;
        display: flex;
      }

      div.infoCard1 {
        background-color: white;
        width: 263px;
        height: 50px;

        margin-right: 24px;
        padding-top: 10px;
        padding-bottom: 10px;

        border-width: 1px;
        border-radius: 20px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      div.infoCard2 {
        background-color: white;
        width: 263px;
        height: 50px;

        margin-left: 24px;
        padding-top: 10px;
        padding-bottom: 10px;

        border-width: 1px;
        border-radius: 20px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 25%);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .infoCard1 label,
      .infoCard2 label {
        font-size: 16px;
        color: black;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .infoCard1 input,
      .infoCard2 input,
      .infoCard1 select,
      .infoCard2 select {
        width: 80%;
        height: 100%;
        padding: 1px 2px 1px 2px;

        border: 1px solid #dce3ea;
        border-radius: 10px;

        text-align: center;
        font-size: 14px;

        background: #f9fbfd;
        outline: none;
      }

      .containerCard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;

        font-family: "Inter", sans-serif;
      }

      div.cardBoxEsquerdo,
      div.cardBoxDireito {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;

        text-align: center;
      }

      #botaoAzul {
        width: 350px;
        height: 59px;
        color: white;
        background-color: #36c3ff;

        border: none;
        border-radius: 40px;

        font-family: "Inter", sans-serif;
        font-weight: bold;
        font-size: 24px;

        display: block;
        text-align: center;
        margin: 38px auto 0 auto;
        line-height: 59px;

        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="login.html">Entrar</a>
        <a href="#">Adotar</a>
        <a href="HomePage.html"
          ><img
            src="imagens/DetalhesAnimal/logoMelhor.png"
            alt="Logo com desenho e escrito"
        /></a>
        <a href="#">Sobre</a>
        <a href="#">F.A.Q</a>
      </nav>
    </header>
    <div id="container">
      <div id="containerFotosAnimal">
        <div id="fotoAnimal">
          <img id="imagemGrande"/>
        </div>
        <div id="cardFotoAnimal">
          <img
            class="miniatura"
            src="#"
            class="ativa"
            onclick="trocarImagem(this)"
          />
          <img
            class="miniatura"
            src="#"
            onclick="trocarImagem(this)"
          />
          <img
            class="miniatura"
            src="#"
            onclick="trocarImagem(this)"
          />
        </div>
      </div>
      <div class="contDescricaoAnimal">
        <div id="descricaoAnimal">
          <input type="text" placeholder="Digite o nome do animal" value="">
          </input>
          <textarea placeholder="Descreva o animal aqui"></textarea>
        </div>
        <div class="containerCard">
          <div class="cardBoxEsquerdo">
            <div class="infoCard1">
              <label for="raca">Raça</label>
              <input id="raca" type="text" placeholder="Digite a raça do animal" value="" />
            </div>
            <div class="infoCard1">
              <label for="idade">Idade</label>
              <input id="idade" type="text" placeholder="Digite a idade do animal" value="" />
            </div>
            <div class="infoCard1">
              <label for="localizacao">Localização</label>
              <input id="localizacao" type="text" placeholder="Digite a localização" value="" />
            </div>
            <div class="infoCard1">
              <label for="microchip">Possui Microchip?</label>
              <select id="microchip">
                <option class="corOption" value="" selected disabled >Selecione uma opção</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
              </select>
            </div>
          </div>
          <div class="cardBoxDireito">
            <div class="infoCard2">
              <label for="sexo">Sexo</label>
              <select id="sexo">
                <option class="corOption" value="" selected disabled >Selecione uma opção</option>
                <option value="masculino">Macho</option>
                <option value="feminino">Fêmea</option>
              </select>
            </div>
            <div class="infoCard2">
              <label for="porte">Porte do animal</label>
              <select id="porte">
                <option class="corOption" value="" selected disabled >Selecione uma opção</option>
                <option value="pequeno">Pequeno</option>
                <option value="medio">Médio</option>
                <option value="grande">Grande</option>
              </select>
            </div>
            <div class="infoCard2">
              <label for="cor">Cor</label>
              <input id="cor" type="text" placeholder="Digite a cor do animal" value="" />
            </div>
            <div class="infoCard2">
              <label for="ong">ONG de resgaste</label>
              <input id="ong" type="text" placeholder="Digite o nome da ONG" value="" />
            </div>
          </div>
        </div>
        <button id="botaoAzul" type="button">Confirmar Registro</button>
      </div>
    </div>
    <script>
      function trocarImagem(elemento) {
        const imagemGrande = document.getElementById("imagemGrande");

        // Troca a imagem principal
        imagemGrande.src = elemento.src;

        // Remove a classe ativa de todas
        document.querySelectorAll("img.miniatura").forEach((img) => {
          img.classList.remove("ativa");
        });

        // Adiciona na clicada
        elemento.classList.add("ativa");
      }
    </script>
  </body>
</html>
